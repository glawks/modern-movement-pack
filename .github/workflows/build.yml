name: build

on:
  push:
    branches: [dev]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Validate and package (Luau; all platforms)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout mod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: mod
          persist-credentials: false
      - name: Checkout pinned OpenRAC SDK tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: OpenRAC/OpenRAC
          ref: 612e29b570353767cba357fd99b2299d34d9ef27
          path: openrac
          sparse-checkout: sdk/tools
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Validate manifest and package script mod
        run: |
          python openrac/sdk/tools/package_mod.py --check mod/openrac-mod.json
          python openrac/sdk/tools/package_mod.py mod -o dist
      - name: Verify archive contents and write checksums
        shell: python
        run: |
          import hashlib, json, pathlib, zipfile
          root = pathlib.Path('dist')
          manifest = json.loads(pathlib.Path('mod/openrac-mod.json').read_text(encoding='utf-8'))
          expected = f"{manifest['id']}-{manifest['version']}.zip"
          archive = root / expected
          assert archive.is_file(), f"Missing {archive}"
          with zipfile.ZipFile(archive) as z:
              entries = set(z.namelist())
              assert {'openrac-mod.json', 'main.luau', 'README.md', 'LICENSE'} <= entries, entries
              assert json.loads(z.read('openrac-mod.json')) == manifest
              assert z.testzip() is None
          digest = hashlib.sha256(archive.read_bytes()).hexdigest()
          (root / 'SHA256SUMS').write_text(f'{digest}  {expected}\n', encoding='utf-8')
          print(f'Built {expected} (SHA256: {digest})')
      - name: Upload test build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rac3-style-jumping-${{ github.run_number }}
          path: |
            dist/*.zip
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    name: Publish tagged release
    needs: package
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download built package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rac3-style-jumping-${{ github.run_number }}
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --verify-tag --title "$TAG" --notes 'RAC3-Style Jumping OpenRAC RAC1 Luau mod. Install the ZIP using the OpenRAC launcher.' dist/*.zip dist/SHA256SUMS
